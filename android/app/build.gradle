plugins { id 'com.android.application' }

android {
    namespace 'com.audiomixing.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.audiomixing.app"
        minSdk 24
        targetSdk 34
        // ★ UI 版本（用户要求手机和电脑这次都输出新版本）。
        //   用户抱怨过"装完的 APK 对不上货"，而诊断报告里的"程序版本"读的就是 versionName ——
        //   升它，用户才能在手机上确认自己装的确实是新包。
        //   （信标/设备卡片里自报的版本也读它，见 Discovery.java 的 APP_VERSION = BuildConfig.VERSION_NAME。）
        // 2.5：端口设置只保留「发现端口」；音频端口自动选空闲口并通过信标公布，
        //      电脑按信标发。2.3/2.4 的音量、智连、屏幕共享、端口修复全部保留。
        // 2.6：与电脑端 2.16 配套发版（音量同步/回声抑制/路由恢复的读端不变，
        //      本版只换版本号与说明，便于在手机上确认装的是配套包）。
        // 2.7：与电脑端 2.17 配套（音量同步根因、系统音量键、卸载后投屏释放、
        //      共享增益只在接收端乘一次、音频端口被占自动换口）。
        // 2.8：卸载监视加强版 —— 1 秒一次同时检查包名与 apk 文件，
        //      卸载/包已删除时立即 MediaProjection.stop()（真机 2.7 仍偶发残留）。
        // 2.9：① 电脑在别人设备上显示「本机」→ 电脑默认名迁移成主机名（PC 2.19）；
        //      ② 开始收听时建 MediaSession，让系统音量面板出现本应用的「App 音量」。
        // 2.10：★ 2026-11-03 Q3 —— 统计包里多报一个 "vol"（0..1 的媒体/App 音量），
        //      电脑端把它折进「我听它的」增益（只会衰减、不会超过用户设的上限）。
        //      老电脑忽略这个键；老手机不发这个键时电脑按 1.0 处理，行为不变。
        // 2.11：★ 2026-11-04 —— ①「送声音」三档（0 未激活 / 1 送声+外放 / 2 送声+静默），
        //      统计包显式上报 "send_mode" + "broadcast"（电脑端准入不再从 want_listen 推断）；
        //      ② 第 2 档静默**未实现**：工程没有本地播放通路，唯一手段是改系统媒体音量，
        //         而用户 2026-11-04 硬性禁止（setStreamVolume / setStreamMute 一律不用），
        //         所以该档在 UI 里标灰、统计包永远不上报 2（绝不改用户系统音量）。
        // 2.12：★ 2026-11-04 —— 与电脑端 2.22 配套：
        //      ① 信标带 device_id + instance_id + ext:1（同一台手机的 WiFi/蓝牙链路合并成一个节点）；
        //      ② 音频扩展段 originId/hop（自回声与超跳帧在接收端丢弃并计数）；
        //      ③ 电脑发来的「请开始/停止接收」不再单向忽略，手机处理并回报 listen_ack；
        //      ④ 智连（自动接听）双判据挂断（音频包 + 心跳都消失才收回），广播时不可用。
        //      第 2 档静默仍未实现（同上：不许动用户系统音量），UI 保持灰。
        // 2.13：★ 2026-11-04 第二轮真机反馈（与电脑端 2.23 配套）：
        //      ①「送声音」改成按一下换一下的循环键（0↔1），不再弹三档弹窗；第 2 档仍未实现，
        //        长按如实说明（不许假实现、不许动系统音量）；
        //      ②「智连」判定不再只看 IP：地址/节点 id/设备名任一命中即视为同一台，换网/双网卡不再失效；
        //      ③ 信标新增 bt_name / bt_mac（手机自报蓝牙身份，电脑用它把 WiFi/蓝牙合成一个节点）；
        //      ④ 交付 APK 文件名带版本号（AudioMixing-手机版-v2.13.apk）。
        // 2.15：★ 2026-11-06 第三轮真机反馈（与电脑端 2.27 配套）：
        //      ① 统计包新增 "vol_in_capture":true —— 采集点在系统/App 音量之后，
        //         电脑端不再二次衰减（修复 WiFi 路径中间档位听不见）；
        //      ② 其余与 2.14 相同（本版只补音量链路声明，不改送声档位、不动系统音量）。
        // 2.16：v2.27 的 vol_in_capture 只是"让电脑别乘"，但真机上采集点其实在系统音量
        //       **之前**（录屏语义），所以音量旋钮完全不影响耳机。本版由手机在发送前
        //       把系统媒体音量乘进 PCM（第 2 档静音时用压之前的原始值），电脑端仍然不乘。
        // 2.17：把采集层的乘数与增益前后电平随统计包上报（vol_q14/gain_q14/total_q14/
        //       raw_peak/post_peak），用来在真机上证明"音量乘法到底有没有生效"。
        // 2.18：★ 2026-11-06 第五轮真机反馈（与电脑端 2.30 配套）：
        //      ① 静音档（第 2 档）不再把进入静音那一刻的旧音量当乘数：每次归零前
        //         先把用户/App 刚调到的值记为"最新意图"，硬件键也能一档一档加上去；
        //         修复「外放档正常、静音档 100→10 几乎不变」；
        //      ② 信标新增 send_mode / broadcast —— 电脑「只听」不必再猜广播身份。
        // 2.19：★ 2026-11-06 与本轮电脑端 2.31 配套（自主测试轮）：
        //      本版不改手机逻辑，只升版本号 —— 电脑端修了「测试节点名混进设备列表」
        //      「本机卡片出现在局域网列表」「横幅用了虚拟网卡地址 172.x」三处 UI 残留，
        //      手机端重发是为了让用户能靠 versionName 确认装的是同一轮交付的包。
        versionCode 34
        versionName "2.20"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // ★ 需要 BuildConfig：AGP 8 默认不生成它，而信标自报版本要读 BuildConfig.VERSION_NAME
    //   （见 Discovery.java 的 APP_VERSION）——否则电脑端设备卡片上永远是写死的旧版本号。
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
}

// 源码是 UTF-8，但这台机器（以及很多中文 Windows）javac 默认按 GBK 读源码，
// 字符串里的中文会变成乱码 —— 而这个 App 界面上全是中文，这一条不设就白写了。
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

// 刻意不引入 appcompat：它会把旧版 kotlin-stdlib 拖进来，和 AGP 自带的版本
// 撞出一堆 Duplicate class。这个 App 只用系统 API，零依赖就够，构建还更快更稳。
