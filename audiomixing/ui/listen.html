<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Audio Mixing 收音机</title>
<style>
  :root{--bg:#0e1116;--card:#171c24;--line:#242c38;--fg:#e8edf5;--dim:#8b97a8;--acc:#4da3ff;--ok:#3ddc84;--err:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
       padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .big{display:block;width:100%;padding:18px;border:0;border-radius:12px;font-size:18px;font-weight:600;
       background:var(--acc);color:#06121f;cursor:pointer}
  .big.stop{background:var(--err);color:#2a0b0b}
  .big:disabled{opacity:.5}
  .row{display:flex;align-items:center;gap:10px;margin-top:14px}
  .row label{color:var(--dim);font-size:13px;min-width:56px}
  input[type=range]{flex:1;accent-color:var(--acc)}
  .stat{font-size:13px;color:var(--dim);margin-top:12px;line-height:1.7}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}
  .dot.on{background:var(--ok)}.dot.err{background:var(--err)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .warn{color:#ffcc66;font-size:12.5px;margin-top:10px}
  .tip{color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<h1>Audio Mixing 收音机</h1>
<div class="sub" id="who">正在读取节点信息…</div>

<div class="card">
  <button class="big" id="btn">开始收听</button>
  <div class="row">
    <label>音量</label>
    <input type="range" id="vol" min="0" max="1.5" step="0.05" value="1">
    <span class="mono" id="volVal">1.00</span>
  </div>
  <div class="stat">
    <div><span class="dot" id="dot"></span><span id="state">未连接</span></div>
    <div>延迟 <span class="mono" id="lat">—</span>　缓冲 <span class="mono" id="buf">—</span>　丢块 <span class="mono" id="lost">0</span></div>
    <div>格式 <span class="mono" id="fmt">—</span></div>
  </div>
  <div class="warn">iPhone 需要点一下按钮才会出声（系统限制）；锁屏或切到后台会被系统暂停。<br>
  <b>验证方法</b>：在电脑面板上点「播放测试音」，手机上就应该听到 440/1000Hz 的蜂鸣。</div>
</div>

<div class="card">
  <div class="tip"><b>这是什么</b><br>
  这台手机并不是 Audio Mixing 的音频节点（浏览器拿不到 UDP，也拿不到手机的系统声音），
  它只是<b>收听</b>：服务器把「这台电脑正在播放的声音」转发过来。<br>
  想听到声音，那台电脑上要么有路由把它在播的声音送到本机，要么打开「频道 → 广播我的声音」。</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ws = null, ctx = null, gain = null, playAt = 0, playing = false;
let lost = 0, recv = 0, startedAt = 0, rate = 24000, ch = 1;

function setState(text, cls){
  $('state').textContent = text;
  $('dot').className = 'dot' + (cls ? ' ' + cls : '');
}
function fmtTime(s){ return s >= 1 ? s.toFixed(2) + ' s' : Math.round(s * 1000) + ' ms'; }

async function fetchInfo(){
  try{
    const r = await fetch('/api/status', {cache:'no-store'});
    const s = await r.json();
    const ch = s.channel || {};
    const parts = [];
    parts.push(s.node.name + ' 上正在播放的声音');
    if(ch.listen) parts.push('（本机在收听频道）');
    $('who').textContent = parts.join('');
  }catch(e){ $('who').textContent = '读取失败：' + e.message; }
}
fetchInfo();

$('vol').addEventListener('input', () => {
  $('volVal').textContent = Number($('vol').value).toFixed(2);
  if(gain) gain.gain.value = Number($('vol').value);
});
$('volVal').textContent = Number($('vol').value).toFixed(2);

function wsUrl(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return proto + '//' + location.host + '/ws/audio';
}

function stop(){
  playing = false;
  if(ws){ try{ ws.close(); }catch(e){} ws = null; }
  if(ctx){ try{ ctx.close(); }catch(e){} ctx = null; }
  gain = null; playAt = 0;
  $('btn').textContent = '开始收听';
  $('btn').classList.remove('stop');
  setState('已停止');
  $('lat').textContent = '—'; $('buf').textContent = '—';
}

async function start(){
  if(playing) return stop();
  playing = true;
  $('btn').textContent = '连接中…';
  $('btn').classList.add('stop');
  setState('正在连接…');
  try{
    // iOS will not start audio without a user gesture: this call happens inside the
    // click handler, which is exactly what it needs.
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume().catch(()=>{});
    rate = 24000;
    gain = ctx.createGain();
    gain.gain.value = Number($('vol').value);
    gain.connect(ctx.destination);
  }catch(e){
    setState('无法启动音频：' + e.message, 'err');
    return stop();
  }
  playAt = ctx.currentTime + 0.15;   // small lead so the first blocks are not late
  lost = 0; recv = 0; startedAt = Date.now();
  openSocket();
}

function openSocket(){
  ws = new WebSocket(wsUrl());
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    $('btn').textContent = '停止收听';
    setState('已连接，等待声音…', 'on');
    $('fmt').textContent = 'PCM16 · ' + (ch) + 'ch · 24000Hz（服务端已降采样）';
  };
  ws.onmessage = (ev) => {
    if(!ctx || !gain) return;
    const bytes = new Uint8Array(ev.data);
    const frames = bytes.length / 2 / ch;
    if(!frames) return;
    recv++;
    const buf = ctx.createBuffer(ch, frames, 24000);
    for(let c = 0; c < ch; c++){
      const out = buf.getChannelData(c);
      for(let i = 0, p = c * 2; i < frames; i++, p += ch * 2){
        const v = (bytes[p] | (bytes[p + 1] << 8)) << 16 >> 16;
        out[i] = v / 32768;
      }
    }
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(gain);
    const now = ctx.currentTime;
    if(playAt < now + 0.05) playAt = now + 0.05;   // fell behind: resync, drop old lead
    src.start(playAt);
    playAt += buf.duration;
    const backlog = playAt - now;
    if(backlog > 1.2){ playAt = now + 0.15; lost++; }
    $('buf').textContent = Math.round(backlog * 1000) + ' ms';
    $('lat').textContent = fmtTime(backlog);
    $('lost').textContent = String(lost);
    setState('正在播放', 'on');
  };
  ws.onclose = () => { if(playing) setState('连接已断开，点按钮重连', 'err'); };
  ws.onerror = () => { setState('连接出错（检查手机和电脑是否同一局域网）', 'err'); };
}

$('btn').addEventListener('click', start);
window.addEventListener('pagehide', stop);
</script>
</body>
</html>
