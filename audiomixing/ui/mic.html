<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Audio Mixing 手机麦克风</title>
<style>
  :root{--bg:#0e1116;--card:#171c24;--line:#242c38;--fg:#e8edf5;--dim:#8b97a8;--acc:#4da3ff;--ok:#3ddc84;--err:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
       padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .big{display:block;width:100%;padding:18px;border:0;border-radius:12px;font-size:18px;font-weight:600;
       background:var(--acc);color:#06121f;cursor:pointer}
  .big.stop{background:var(--err);color:#2a0b0b}
  .row{display:flex;align-items:center;gap:10px;margin-top:14px}
  .row label{color:var(--dim);font-size:13px;min-width:56px}
  input[type=range]{flex:1;accent-color:var(--acc)}
  .stat{font-size:13px;color:var(--dim);margin-top:12px;line-height:1.8}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}
  .dot.on{background:var(--ok)}.dot.err{background:var(--err)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .warn{color:#ffcc66;font-size:12.5px;margin-top:10px}
  .tip{color:var(--dim);font-size:12.5px;line-height:1.75}
  meter{width:100%;height:10px}
</style>
</head>
<body>
<h1>Audio Mixing 手机麦克风</h1>
<div class="sub" id="who">把这部手机变成电脑的一个音源</div>

<div class="card">
  <button class="big" id="btn">开始发送</button>
  <div class="row">
    <label>灵敏度</label>
    <input type="range" id="gain" min="0.2" max="3" step="0.1" value="1">
    <span class="mono" id="gainVal">1.0×</span>
  </div>
  <div class="stat">
    <div><span class="dot" id="dot"></span><span id="state">未开始</span></div>
    <div>已发送 <span class="mono" id="sent">0</span> 秒　延迟约 <span class="mono">0.1</span> 秒</div>
    <div>电平 <meter id="meter" min="0" max="1" value="0" low="0.02" high="0.7" optimum="0.4"></meter></div>
  </div>
  <div class="warn">手机必须和电脑连同一个 Wi-Fi。iPhone 需要点一下按钮才会开始（系统限制）。</div>
</div>

<div class="card">
  <div class="tip"><b>它发送的是什么</b><br>
  这个页面发送的是<b>麦克风</b>的声音（说话、环境音）。<br>
  想发送手机里<b>播放的视频/音乐的声音</b>，浏览器做不到 —— 那需要安卓 App 用系统接口采集，
  用 App 里的「系统声音」模式即可，接收端是同一个入口。</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const NAME = new URLSearchParams(location.search).get('name') || '手机';
let stream = null, ctx = null, node = null, source = null;
let running = false, sent = 0, queue = [], sending = false, peak = 0;

$('who').textContent = '发送为：' + NAME;
$('gain').addEventListener('input', () => { $('gainVal').textContent = Number($('gain').value).toFixed(1) + '×'; });
$('gainVal').textContent = Number($('gain').value).toFixed(1) + '×';

function setState(text, cls){
  $('state').textContent = text;
  $('dot').className = 'dot' + (cls ? ' ' + cls : '');
}

// The phone may run at 44100 or 48000; the server resamples, but telling it the truth
// avoids a needless conversion.
function post(block){
  // 100 ms of mono PCM16 per request, over one keep-alive connection.
  return fetch('/api/mic/stream?name=' + encodeURIComponent(NAME) + '&rate=' + ctx.sampleRate, {
    method: 'POST',
    headers: {'Content-Type': 'application/octet-stream'},
    body: block,
    keepalive: true,
  });
}

async function start(){
  if(running) return stop();
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false},
    });
  }catch(e){
    setState('拿不到麦克风权限：' + e.message, 'err');
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume().catch(()=>{});
  source = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor ? ctx.createScriptProcessor(2048, 1, 1) : null;
  if(!node){ setState('这个浏览器不支持采集（请用 Chrome / Safari）', 'err'); return; }
  node.onaudioprocess = (ev) => {
    const input = ev.inputBuffer.getChannelData(0);
    const g = Number($('gain').value);
    const out = new Int16Array(input.length);
    let localPeak = 0;
    for(let i = 0; i < input.length; i++){
      let v = input[i] * g;
      if(v > 1) v = 1; else if(v < -1) v = -1;
      const a = v < 0 ? -v : v;
      if(a > localPeak) localPeak = a;
      out[i] = v * 32767;
    }
    peak = Math.max(localPeak, peak * 0.8);
    queue.push(out.buffer);
  };
  source.connect(node);
  node.connect(ctx.destination);   // ScriptProcessor only runs when connected
  running = true;
  $('btn').textContent = '停止发送';
  $('btn').classList.add('stop');
  setState('正在发送（电脑面板 ⑥ 频道的音源里会出现这台手机）', 'on');
  pump();
  setInterval(() => {
    $('sent').textContent = (sent / 10).toFixed(1);
    $('meter').value = Math.min(1, peak);
  }, 500);
}

function stop(){
  running = false;
  try{ node && node.disconnect(); }catch(e){}
  try{ source && source.disconnect(); }catch(e){}
  try{ stream && stream.getTracks().forEach(t => t.stop()); }catch(e){}
  try{ ctx && ctx.close(); }catch(e){}
  node = source = ctx = stream = null;
  $('btn').textContent = '开始发送';
  $('btn').classList.remove('stop');
  setState('已停止');
}

// One request in flight at a time: a phone on a slow link must fall behind rather than
// pile up requests, and the server drops the oldest audio anyway.
async function pump(){
  while(running){
    if(!queue.length || sending){ await new Promise(r => setTimeout(r, 20)); continue; }
    const block = queue.shift();
    sending = true;
    try{
      const r = await post(block);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      sent++;
    }catch(e){
      setState('发送失败：' + e.message + '（检查是否和电脑同一个 Wi-Fi）', 'err');
      stop();
      return;
    }finally{
      sending = false;
    }
  }
}

$('btn').addEventListener('click', start);
window.addEventListener('pagehide', stop);
</script>
</body>
</html>
